name: weekly review

# Loop 5 in LOOP.md. Trend analysis, harness proposal, defect sweep.
# Proposes; never applies.

on:
  schedule:
    - cron: "0 14 * * 5"   # Friday 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Check the kill switch
        run: grep -qE '^\s*paused:\s*true' STATE.md && exit 78 || true

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: pip install -r loop/requirements.txt

      # Publishing trend — drafts opened vs merged, and how much a human had to
      # change. A shrinking edit size is the evidence for promoting L1 to L2.
      - name: Compute the publishing trend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p history
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          OPENED=$(gh pr list --label insight --state all --search "created:>=$SINCE" --json number -q 'length')
          MERGED=$(gh pr list --label insight --state merged --search "merged:>=$SINCE" --json number -q 'length')
          WAIVERS=$(node scripts/check-claims.mjs --json | python -c 'import json,sys; print(json.load(sys.stdin)["warnings"])' || echo 0)
          printf '{"week":"%s","drafts_opened":%s,"drafts_merged":%s,"gate_warnings":%s}\n' \
            "$(date -u +%G-W%V)" "$OPENED" "$MERGED" "$WAIVERS" >> history/publishing.jsonl
          cat history/publishing.jsonl | tail -5

      # The self-improvement loop. Writes a proposal file, applies nothing.
      - name: Harness change proposal
        id: improve
        continue-on-error: true
        run: python loop/improve.py

      - name: Open the review PR
        if: steps.improve.outputs.has_proposal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="review/$(date -u +%Y-%m-%d)"
          git config user.name  "gjh-content-loop"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add history/ proposals/ reports/
          git commit -m "weekly review: trend + harness proposal"
          git push origin "$BRANCH"
          gh pr create --label "harness" --title "Weekly review — $(date -u +%Y-%m-%d)" --body "
          Generated by \`loop/improve.py\` and the weekly review workflow.

          **Merging this changes how every future audit is scored.** Read the
          proposal before approving, and reject any amendment that raises scores
          by lowering the bar. Score inflation is the failure mode this loop
          exists to prevent, and the loop cannot detect it in itself.

          Confidence reported by the improver: \`${{ steps.improve.outputs.confidence }}\`
          Runs analysed: \`${{ steps.improve.outputs.runs }}\`
          "

      - name: Defect sweep
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Read,Grep,Glob,Write,Bash(npm run *),Bash(git *),Bash(gh issue *)"
          prompt: |
            Run the /defect-sweep command using the defect-sweeper subagent.
            Write reports/$(date -u +%Y-%m-%d)-sweep.md and open one issue per
            blocking finding, labelled `defect`. Fix only what the subagent's
            allowlist permits. Report the state of D1, D4, D5, and D7 explicitly
            whether or not they have changed.
