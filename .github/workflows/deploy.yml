name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type-check before deployment
        run: npm run typecheck
      - name: Build for Cloudflare Pages
        run: npm run pages:build
        env:
          NEXT_PUBLIC_SITE_URL: https://gjh-inc.com
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=gjh-inc-web --branch=main
      - name: Verify production content
        env:
          SITE_URL: https://gjh-inc.com
        run: |
          python3 - <<'PY'
          import os, time, urllib.request, html
          base = os.environ['SITE_URL'].rstrip('/')
          checks = {
              '/': 'Configurable-product order intake with human confirmation',
              '/work': 'Configurable-product order intake with human confirmation',
              '/sectors': 'Structured product requests with human confirmation',
              '/work/structured-order-intake': 'Configurable-product order intake with human confirmation',
              '/sitemap.xml': '/work/structured-order-intake',
          }
          pending = dict(checks)
          for attempt in range(12):
              for path, expected in list(pending.items()):
                  url = base + path + '?deployment=' + os.environ['GITHUB_SHA']
                  try:
                      request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'GJH-deployment-verification'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = html.unescape(response.read().decode('utf-8'))
                      if expected not in body:
                          raise ValueError('Expected updated content missing')
                      if path in ('/', '/sectors') and ('Waiting on approval' in body or 'Named case studies are pending client approval' in body):
                          raise ValueError('Obsolete approval placeholder remains')
                      del pending[path]
                      print('Verified:', path)
                  except Exception as error:
                      print('Pending:', path, type(error).__name__)
              if not pending:
                  break
              if attempt < 11:
                  time.sleep(15)
          if pending:
              raise SystemExit('Production verification failed for: ' + ', '.join(pending))
          PY
      - name: Record deployment result
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          echo "## Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: $DEPLOY_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: Cloudflare Pages / gjh-inc-web / main" >> "$GITHUB_STEP_SUMMARY"
