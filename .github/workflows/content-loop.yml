name: content-loop

on:
  schedule:
    # Loop 3 — daily audit, 07:00 America/Chicago (12:00 UTC)
    - cron: "0 12 * * *"
    # Loop 4 — monthly harness review, 1st of the month
    - cron: "0 14 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run with fixtures and the stub grader (no API spend)"
        type: boolean
        default: false

concurrency:
  group: content-loop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.run.outputs.status }}
      mean: ${{ steps.run.outputs.mean_overall }}
      delta: ${{ steps.run.outputs.delta }}
      report: ${{ steps.run.outputs.report_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install opencode (audit)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g opencode-ai@latest
      - name: Verify opencode works
        run: opencode run -m opencode/deepseek-v4-flash-free --format json "ok" >/dev/null

      - run: pip install -r loop/requirements.txt

      # The pipeline verifies itself before it is allowed to spend tokens.
      - name: Smoke test the loop
        run: python loop/audit.py --dry-run
        env:
          GITHUB_OUTPUT: /dev/null

      - name: Reset smoke-test trace
        run: git checkout -- history/ 2>/dev/null || true

      - name: Audit
        id: run
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python loop/audit.py --dry-run
          else
            python loop/audit.py
          fi

# Auto-ship: a clean audit commits its report + trace to main directly,
      # so the human inbox only gets the summary and any PRs that need action.
      # Capture what changed + the commit hash so the email can show it.
      - name: Auto-ship audit artifacts to main
        id: autoship
        if: steps.run.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "gjh-content-loop"
          git config user.email "actions@github.com"
          git add reports/ history/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no artifact changes"
            exit 0
          fi
          git commit -m "content loop: audit $(date -u +%Y-%m-%d) (mean ${{ steps.run.outputs.mean_overall }})"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          SHA=$(git rev-parse --short HEAD)
          { echo "## Changed this run (auto-shipped to main)"; echo ""; \
            git show --stat --oneline "$SHA" | tail -n +3 | \
            sed 's/^/  - /'; echo ""; \
            echo "Commit: \`$SHA\` (${{ github.server_url }}/${{ github.repository }}/commit/$SHA)"; } \
            > "$GITHUB_WORKSPACE/tmp-change-summary.md"
          git push origin main

      # Build the full email body with per-file change details so the daily
      # mail shows exactly what landed, with a link to each commit.
      - name: Build email body
        id: mailbody
        run: |
          {
            echo "gjh-inc.com content loop — $(date -u +%Y-%m-%d)"
            echo ""
            echo "Status: ${{ steps.run.outputs.status }}"
            echo "Mean:   ${{ steps.run.outputs.mean_overall }}  (Δ ${{ steps.run.outputs.delta }})"
            echo ""
            if [ -f "$GITHUB_WORKSPACE/tmp-change-summary.md" ]; then
              cat "$GITHUB_WORKSPACE/tmp-change-summary.md"
            else
              echo "No artifacts auto-shipped this run."
            fi
            echo ""
            echo "Harness proposals arrive as pull requests awaiting your review."
          } > "$GITHUB_WORKSPACE/tmp-mailbody.txt"
          { echo "body<<EOF"; cat "$GITHUB_WORKSPACE/tmp-mailbody.txt"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Escalate a failure or regression
        if: steps.run.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Content loop ${{ steps.run.outputs.status }} — mean ${{ steps.run.outputs.mean_overall }} (Δ ${{ steps.run.outputs.delta }})" \
            --body-file "${{ steps.run.outputs.report_path }}" \
            --label "content-loop" --label "priority"

      # Notification only — fails soft so a mail outage never fails the run.
      # Only emailed when the audit auto-shipped a real change.
      - name: Email daily summary
        if: steps.autoship.outputs.changed == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Content loop daily — mean ${{ steps.run.outputs.mean_overall }} (Δ ${{ steps.run.outputs.delta }})"
          to: georjero@gmail.com
          from: ${{ secrets.SMTP_USERNAME }}
          body: ${{ steps.mailbody.outputs.body }}

  improve:
    # Human-in-the-loop: harness proposals are never auto-merged.
    # Loop 4 only runs on the monthly cron or an explicit manual run.
    needs: audit
    if: github.event.schedule == '0 14 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install opencode (improve)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g opencode-ai@latest

      - run: pip install -r loop/requirements.txt

      - name: Analyze traces and propose harness changes
        id: improve
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python loop/improve.py --dry-run
          else
            python loop/improve.py
          fi

      # A harness change alters how every future audit is scored, so it gets its
      # own PR, its own reviewer, and never rides along with a content PR.
      - name: Open harness proposal PR
        if: steps.improve.outputs.has_proposal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="content-loop/harness-$(date -u +%Y-%m)"
          git config user.name  "gjh-content-loop"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add reports/
          git diff --staged --quiet && exit 0
          git commit -m "content loop: harness proposal $(date -u +%Y-%m)"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Harness proposal $(date -u +%Y-%m) — confidence: ${{ steps.improve.outputs.confidence }}" \
            --body-file "${{ steps.improve.outputs.proposal_path }}" \
            --label "content-loop" --label "harness-change" --label "needs-human-review"

      - name: Email harness proposal notification
        if: steps.improve.outputs.has_proposal == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Content loop — harness proposal awaiting your review"
          to: georjero@gmail.com
          from: ${{ secrets.SMTP_USERNAME }}
          body: harness proposal PR opened; review before merge.
          html_body: "harness proposal PR opened; review before merge."

  notify-failure:
    # If anything fails before its own summary email can run, this job still
    # emails the human. Notification only — fails soft.
    needs: [audit, improve]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Email workflow failure
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Content loop FAILED — ${{ github.run_name }} / ${{ github.run_number }}"
          to: ${{ secrets.SMTP_USERNAME }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            The content loop workflow failed.
            Repo:    ${{ github.repository }}
            Run:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Reason:  check the run logs above.