# Evidence ledger
#
# Every number, client reference, and outcome claim on the public site resolves
# to an id in here. `scripts/check-claims.mjs` enforces it. Nothing with a
# status other than `published` may appear on a rendered page.
#
# status:
#   published      — written approval on file, safe to name and quantify
#   needs-approval — real work, no client sign-off yet. Publishable only in
#                    generalised form with no identifying detail
#   internal       — true, ours, never client-facing
#   proposed       — not yet true. A plan, not evidence
#
# Adding an entry is a human commit. Agents may read this file and may propose
# additions in a PR body, but gate.yaml denylists it against unattended writes.

- id: founded-2009
  claim: "GJH Inc. has been consulting since 2009."
  source: "gjh-inc.com, stated publicly since launch"
  status: published
  owner: george

