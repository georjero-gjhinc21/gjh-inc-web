- id: bank-rag-assessment
  claim: >
    Architecture assessment of an internal retrieval platform at a large retail
    bank: 20 retrieval modes, 11 services, 5 datastores, workflow orchestration.
    Findings covered document-level entitlements at query time, the absence of a
    golden test set, rubric versioning in score traces, and a regression gate.
  source: "engagement artifacts, held privately"
  status: needs-approval
  owner: george
  blocked_on: "client approval to reference the engagement, even unnamed"
  generalised_form: >
    Safe to write about the pattern — a retrieval platform that turned an
    unresolved evaluation problem into a configuration surface — without naming
    the institution, the platform, or the team.

